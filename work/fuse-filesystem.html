 Django + Django REST Framework to manage API endpoints for user authentication, product management, and search logic.\n- **Data Integrity \u0026 Testing:** Utilized Django ORM for schema maintenance and implemented seven distinct unit tests covering critical workflows like database insertion, user registration, and messaging.\n- **Agile Management:** Managed development via the Scrum framework, utilizing Git feature branches and Kanban tracking to maintain a high sprint velocity.\n\n## Technologies\n\n- Django\n- React\n- PostgreSQL\n- JWT Authentication\n- Postman\n\n## Key Features\n- **Integrated Messaging:** Secure communication channel for users to coordinate exchanges directly within the platform.\n- **Comprehensive Search:** Keyword-based searching and category filtering to enhance item discoverability.\n- **Administrative Control:** Includes a Django Admin Panel for data entry, user management, and platform oversight.\n\n## Impact \u0026 Future Scalability\n- **Community Safety:** The platform mitigates risks such as transaction scams through an integrated reporting system and planned verified university email authentication.\n- **Scalable Design:** The combination of PostgreSQL and Django's modular architecture ensures the system can scale to handle thousands of concurrent student users.\n- **Sustainability:** Encourages a circular economy within the campus community, reducing waste by facilitating the exchange of pre-owned academic materials.\n\n---"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$L10\",null,{\"as\":\"section\",\"maxWidth\":\"m\",\"horizontal\":\"center\",\"gap\":\"l\",\"children\":[[\"$\",\"$L1b\",null,{\"id\":\"schema-blogPosting-/work/fuse-filesystem\",\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BlogPosting\\\",\\\"url\\\":\\\"https://demo.magic-portfolio.com/work/fuse-filesystem\\\",\\\"sameAs\\\":[],\\\"headline\\\":\\\"FUSE Filesystem\ r processes and reducing latency; utilized Postman for API testing and debugging to ensure reliability and performance.\\n\\nBuilt analytics dashboard for investment platform using Next.js, creating visualizations for portfolio metrics and performance tracking that enabled data-driven investment decisions.\\n\\n## Technologies\\n\\n- Node.js\\n- MongoDB\\n- RESTful APIs\\n- Next.js\\n- Postman\\n\",\"avatars\":[{\"src\":\"/images/avatar.jpg\"}],\"link\":\"\"}]\n26:T990,"])</script><script>self.__next_f.push([1,"\n[Click here to View Project](https://www.algogators.com/post/using-temporal-fusion-transformers-for-market-regime-detection)\n\n## Overview\n\nThis project investigates the application of the Temporal Fusion Transformer (TFT)—a deep learning architecture designed for multi-horizon time series forecasting—to the task of market regime detection. The goal was to determine if the TFT’s attention mechanisms could outperform traditional Long Short-Term Memory (LSTM) models and unsupervised methods like Hidden Markov Models (HMM) in identifying structural shifts in financial markets.\n\n\n## Methodology\n\n\n1. Data Integration: The study utilized a diverse dataset (2000–2021) combining high-frequency daily price data for the SPY ETF with lower-frequency macroeconomic indicators, such as the VIX, Federal Funds Rate, and Economic Policy Uncertainty indices.\n\n\n2. Feature Engineering: Key features included realized volatility (RV), RV lags, logarithmic returns, and squared log returns to provide the models with deep statistical context.\n\n\n\n3. Regime Labeling: Because market regimes are not pre-labeled, an unsupervised K-means clustering technique was used to identify four distinct market regimes based on realized volatility.\n\n\n\n4. Model Training: A TFT model (implemented via PyTorch Forecasting) was trained against a benchmark LSTM, both restricted to ~70,000 parameters to ensure a fair comparison of architectural performance.\n\n\n## Key Findings\n- Predictive Accuracy: The LSTM achieved a higher raw accuracy (86%) compared to the TFT (17%).\n\n- The \"Safe Prediction\" Trap: Analysis revealed that the LSTM’s high accuracy was likely due to \"safe\" predictions—consistently outputting the most prevalent regime.\n\n- Structural Insight: While the TFT had lower accuracy, it achieved a superior F1 score (0.92 vs. 0.14 for the LSTM), indicating a much better balance between precision and recall. This suggests the TFT is more capable of detecting actual shifts in data structure rather than just following the most common state.\n\n\n## Conclusion \nWhile the LSTM appeared superior on paper, the Temporal Fusion Transformer demonstrated a unique potential for identifying complex structural changes in market behavior. Future research will explore larger datasets and refined transformer architectures like the \"Informer\" to further enhance regime classification.\n\n## Technologies\n\n- PyTorch\n- Pandas\n- NumPy\n- Machine Learning (TFT, LSTM)\n"])</script><script>self.__next_f.push([1,"23:[\"$\",\"$L20\",\"temporal-fusion-transformers\",{\"priority\":false,\"href\":\"/work/temporal-fusion-transformers\",\"images\":[\"/images/gallery/tft_pic.png\"],\"title\":\"Temporal Fusion Transformers Regime Detection\",\"description\":\"Market regime detection using Temporal Fusion Transformers vs LSTM.\",\"content\":\"$26\",\"avatars\":[{\"src\":\"/images/avatar.jpg\"}],\"link\":\"\"}]\n24:[\"$\",\"$L20\",\"amazon-route-optimization\",{\"priority\":false,\"href\":\"/work/amazon-route-optimization\",\"images\":[\"/images/gallery/Fastest-Route-20-min.png\"],\"title\":\"Amazon Route Optimization\",\"description\":\"Statistical analysis of Amazon Delivery Dataset revealing correlational relationships.\",\"content\":\"[Click here to View Project](https://github.com/idkh0wtocode/DataAnalysis)\\n\\n## Overview\\n\\nAnalyzed Amazon Delivery Dataset from Kaggle using Pandas, NumPy, and Matplotlib/Seaborn, revealing correlational relationships t
